<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Customer - GARAGE TB</title>
    <style>
        :root {
            --primary-bg: #070d1d;
            --card-bg: #111b33;
            --border-color: #1f3359;
            --accent-color: #0072ff;
            --accent-hover: #0056cc;
            --text-light: #f4f6f9;
            --text-gray: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .register-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        .register-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .register-header img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            background: #fff;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .register-header h2 {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .register-header p {
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 11px 15px;
            background-color: var(--primary-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        .btn-register {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(0, 114, 255, 0.3);
        }

        .btn-register:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .register-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .register-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="register-header">
            <img src="logo-garage-tb.png" alt="Logo GARAGE TB">
            <h2>Registrasi Customer</h2>
            <p>Buat akun baru khusus untuk pelanggan GARAGE TB</p>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="nama">Nama Lengkap Customer</label>
                <input type="text" id="nama" class="form-control" placeholder="Masukkan nama lengkap Anda" required>
            </div>

            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" class="form-control" placeholder="nama@email.com" required>
            </div>

            <div class="form-group">
                <label for="whatsapp">Nomor WhatsApp Aktif</label>
                <input type="tel" id="whatsapp" class="form-control" placeholder="Contoh: 08123456789" required>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat / Domisili</label>
                <input type="text" id="alamat" class="form-control" placeholder="Kota / Wilayah Anda" required>
            </div>

            <div class="form-group">
                <label for="password">Kata Sandi (Password)</label>
                <input type="password" id="password" class="form-control" placeholder="Minimal 6 karakter" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Konfirmasi Kata Sandi</label>
                <input type="password" id="confirm_password" class="form-control" placeholder="Masukkan ulang kata sandi" required>
            </div>

            <button type="submit" class="btn-register">Daftar Sebagai Customer</button>
        </form>

        <div class="register-footer">
            <p>Sudah punya akun customer? <a href="login.html">Masuk di sini</a></p>
            <p style="margin-top: 10px;"><a href="index.html">&larr; Kembali ke Beranda Utama</a></p>
        </div>
    </div>

    <script>
        function handleRegister(event) {
            event.preventDefault();
            
            var pass = document.getElementById("password").value;
            var confirmPass = document.getElementById("confirm_password").value;

            if (pass !== confirmPass) {
                alert("Kata sandi dan konfirmasi kata sandi tidak cocok!");
                return;
            }

            alert("Registrasi berhasil! Silakan login menggunakan akun Anda.");
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
