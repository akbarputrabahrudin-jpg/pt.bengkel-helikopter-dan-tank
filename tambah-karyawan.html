<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Akun Internal - GARAGE TB (Owner Dashboard)</title>
    <style>
        :root {
            --primary-color: #0b1329;
            --accent-color: #0072ff;
            --text-light: #f4f6f9;
            --text-gray: #b0c4de;
            --card-bg: #152238;
            --warning-color: #ffaa00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid #203554;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header span {
            display: inline-block;
            background-color: rgba(255, 170, 0, 0.15);
            color: var(--warning-color);
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
            border: 1px solid var(--warning-color);
        }

        .header h2 {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 6px;
        }

        .form-control, select.form-control {
            width: 100%;
            padding: 12px 15px;
            background-color: #0b1329;
            border: 1px solid #203554;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus, select.form-control:focus {
            border-color: var(--accent-color);
        }

        select.form-control option {
            background-color: #0b1329;
            color: #fff;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #0056cc;
            transform: translateY(-2px);
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .footer-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span>KHUSUS AKSES OWNER</span>
            <h2>Pendaftaran Akun Internal</h2>
            <p>Buat akun baru untuk Teknisi, Staff, Admin, atau Role Lainnya</p>
        </div>

        <form action="dashboard-owner.html" method="GET">
            <div class="form-group">
                <label for="nama">Nama Lengkap Karyawan / Staff</label>
                <input type="text" id="nama" class="form-control" placeholder="Nama lengkap pegawai" required>
            </div>

            <div class="form-group">
                <label for="email">Alamat Email Perusahaan / Pribadi</label>
                <input type="email" id="email" class="form-control" placeholder="nama@garagetb.com" required>
            </div>

            <div class="form-group">
                <label for="whatsapp">Nomor WhatsApp Aktif</label>
                <input type="tel" id="whatsapp" class="form-control" placeholder="08123456789" required>
            </div>

            <div class="form-group">
                <label for="role">Pilih Role / Hak Akses Sistem</label>
                <select id="role" class="form-control" required>
                    <option value="" disabled selected>-- Pilih Peran / Jabatan --</option>
                    <option value="admin">Admin Sistem</option>
                    <option value="teknisi_helikopter">Teknisi Helikopter</option>
                    <option value="teknisi_tank">Teknisi Tank</option>
                    <option value="teknisi_elektronik">Teknisi Elektronik / Microsoldering</option>
                    <option value="staff_gudang">Staff Gudang & Sparepart</option>
                    <option value="finance">Finance / Keuangan</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Kata Sandi (Password) Sementara</label>
                <input type="password" id="password" class="form-control" placeholder="Berikan sandi awal ke karyawan" required>
            </div>

            <button type="submit" class="btn-submit">Daftarkan Akun Internal</button>
        </form>

        <div class="footer-link">
            <p><a href="login.html">&larr; Kembali ke Halaman Login Utama</a></p>
        </div>
    </div>

</body>
</html>
